<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <meta name="theme-color" content="#0d2818">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="IAQ Learning">
  <title>Under Construction - IAQ Learning</title>
  <link rel="icon" type="image/png" sizes="16x16" href="assets/icons/favicon-16x16.png">
  <link rel="icon" type="image/png" sizes="32x32" href="assets/icons/favicon-32x32.png">
  <link rel="apple-touch-icon" href="assets/icons/apple-touch-icon.png">
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  <style>
    * { margin:0; padding:0; box-sizing:border-box; }
    body {
      font-family: 'Poppins', sans-serif;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #0d2818;
      padding: 20px;
    }
    .container {
      text-align: center;
      max-width: 400px;
    }

    /* Icon */
    .icon {
      font-size: 4rem;
      color: #d4af37;
      margin-bottom: 16px;
      display: block;
      animation: bounce 2s ease-in-out infinite;
    }
    @keyframes bounce {
      0%, 100% { transform: translateY(0); }
      50% { transform: translateY(-10px); }
    }

    /* Title */
    h1 {
      font-size: 1.8rem;
      font-weight: 800;
      color: white;
      letter-spacing: -0.5px;
    }
    h1 span { color: #d4af37; }

    /* Subtitle */
    .sub {
      font-size: 0.75rem;
      color: rgba(255,255,255,0.3);
      text-transform: uppercase;
      letter-spacing: 3px;
      margin: 4px 0 20px;
    }

    /* Line */
    .line {
      width: 50px;
      height: 2px;
      background: #d4af37;
      margin: 0 auto 20px;
      border-radius: 4px;
    }

    /* Message */
    p {
      color: rgba(255,255,255,0.6);
      font-size: 0.9rem;
      font-weight: 300;
      line-height: 1.7;
      margin-bottom: 28px;
    }

    /* Button */
    .btn {
      display: inline-flex;
      align-items: center;
      gap: 10px;
      padding: 12px 32px;
      background: rgba(255,255,255,0.06);
      border: 1px solid rgba(255,255,255,0.08);
      color: white;
      border-radius: 12px;
      font-size: 0.85rem;
      font-weight: 600;
      text-decoration: none;
      font-family: inherit;
      transition: all 0.3s ease;
    }
    .btn:hover {
      background: rgba(212,175,55,0.12);
      border-color: rgba(212,175,55,0.2);
      transform: translateY(-2px);
    }
    .btn i { font-size: 0.8rem; transition: transform 0.3s; }
    .btn:hover i { transform: translateX(-4px); }

    /* Footer */
    .footer {
      margin-top: 28px;
      font-size: 0.6rem;
      color: rgba(255,255,255,0.15);
      letter-spacing: 1px;
    }
    .footer span { color: rgba(212,175,55,0.3); }

    /* Responsive */
    @media (max-width: 480px) {
      h1 { font-size: 1.4rem; }
      .icon { font-size: 3rem; }
      .btn { width: 100%; justify-content: center; padding: 14px; }
    }
  </style>
</head>
<body>

  <div class="container">

    <!-- Icon -->
    <span class="icon">
      <i class="fas fa-triangle-exclamation"></i>
    </span>

    <!-- Title -->
    <h1>Under <span>Construction</span></h1>

    <!-- Subtitle -->
    <p class="sub">✦ SIAQ Learning ✦</p>

    <!-- Line -->
    <div class="line"></div>

    <!-- Message -->
    <p>This page is currently<br>under development.</p>

    <!-- Button -->
    <a href="/index.html" class="btn">
      <i class="fas fa-arrow-left"></i> Back to Home
    </a>

    <!-- Footer -->
    <div class="footer">
      <span>✦</span> v2.2.0 <span>✦</span>
      <br><span>✦</span> Ahmad Zaman Huri <span>✦</span></>
    </div>

  </div>

</body>
</html>
